# Replace the process-wide default backend in headless profiles. The Web bundle
# already disables this row because each agent preset owns an isolated backend.
- id: compaction-basic
  disabled: true

# Web presets isolate their own pruner. Re-enable the host-plane copy so this
# process-wide compactor can prune an oversized tool result before summarizing.
- id: tool-result-pruner
  disabled: false

- insert:
    - id: compaction-absolute-tokens
      name: deepseek-harness-compaction-ui
      config:
        thresholdMode: tokens
        thresholdTokens: 256000
        thresholdRatio: 0.8
        retainMode: tokens
        retainTokens: 64000
        retainRatio: 0.16
        contextWindowTokens: 1000000
        maxTokens: 8192
        compactionRetries: 1
        maxOverflowRetries: 1
        auto: true
